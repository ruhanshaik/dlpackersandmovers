<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#F4F4F4">
  <title>Page Not Found | DL Packers &amp; Movers</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 85% 12%, rgba(248, 61, 61, 0.1), transparent 28rem),
        var(--bg-page);
      color: var(--charcoal);
    }

    .error-header {
      width: min(1120px, calc(100% - 40px));
      margin: 24px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .error-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--charcoal);
      font-weight: 700;
      line-height: 1.15;
    }

    .error-brand img {
      width: 68px;
      height: 48px;
      object-fit: contain;
    }

    .error-home-link {
      color: var(--charcoal);
      font-weight: 600;
    }

    .error-main {
      width: min(720px, calc(100% - 40px));
      margin: auto;
      padding: 72px 0;
      text-align: center;
    }

    .error-code {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--brand-red);
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.95;
    }

    .error-main h1 {
      margin-bottom: 14px;
      font-size: clamp(2rem, 6vw, 3.25rem);
    }

    .error-main p {
      max-width: 560px;
      margin: 0 auto 14px;
      color: #5B6472;
      font-size: 1.05rem;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .error-actions a {
      min-height: 48px;
      padding: 14px 24px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .error-actions a:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .error-actions__home {
      background: var(--button-background);
      color: var(--white);
    }

    .error-actions__contact {
      border-color: var(--border-subtle) !important;
      background: var(--white);
      color: var(--charcoal);
    }

    .error-footer {
      padding: 20px;
      color: #707783;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .error-header {
        width: calc(100% - 28px);
        margin-top: 14px;
      }

      .error-brand img {
        width: 58px;
        height: 42px;
      }

      .error-main {
        width: calc(100% - 32px);
        padding: 56px 0;
      }
    }
  </style>
</head>
<body>
  <header class="error-header">
    <a class="error-brand" href="index.html" aria-label="DL Packers and Movers home">
      <img src="assets/images/brand-logo.png" alt="DL Packers &amp; Movers logo" width="68" height="48">
      <span>Packers &amp;<br>Movers</span>
    </a>
    <a class="error-home-link" href="index.html">Home</a>
  </header>

  <main class="error-main">
    <span class="error-code" aria-hidden="true">404</span>
    <h1>Page not found</h1>
    <p>Sorry for the inconvenience. We couldn’t find the page you’re looking for.</p>
    <p>Please check the web address. If you’re offline, turn on mobile data or Wi&#8209;Fi and try again.</p>
    <div class="error-actions">
      <a class="error-actions__home" href="index.html">Go to homepage</a>
      <a class="error-actions__contact" href="contact.html">Contact us</a>
    </div>
  </main>

  <footer class="error-footer">
    DL Packers &amp; Movers · Ballari, Karnataka
  </footer>
</body>
</html>
